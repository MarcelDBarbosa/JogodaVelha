<!DOCTYPE HTML>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Jogo da velha</title>
		<script src="../jquery-2.2.1.js"></script>
		<script src="jogo.js"></script>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<div id="pagina_inicial">
			<h1>JOGO DA VELHA</h1>
			<table border="0" width="800px;">
				<tbody>
					<tr>
						<td align="center">
							<img src="img/jogador1.png" />
							<br />
							<input id="inp_jogador1" type="text" maxlength="15" placeholder="Nome do jogador 1" />
						</td>
						<td align="center">
							<img id="btn_play" src="img/play.png" style="cursor: pointer;"/>
						</td>
						<td align="center">
							<img src="img/jogador3.png" />
							<br />
							<span id="inp_jogador2">Computador</span>
						</td>
					</tr>
				</table>
			</table>
			<div id="mensagem_erro">
    			<h2>Preencher o nome do jogador</h2>
			</div>
		</div>

		<div id="pagina_jogo">
			<div style="display:inline-block;">
				<img src="img/jogador1.png" />
				<br />
				<span id="nome_jogador1"></span>
			</div>

			<div style="display:inline-block;">
				<div class="tabuleiro">
					<div class="jogada" data-indice="0"></div>
					<div class="jogada" data-indice="1"></div>
					<div class="jogada" data-indice="2"></div>
					<div class="jogada" data-indice="3"></div>
					<div class="jogada" data-indice="4"></div>
					<div class="jogada" data-indice="5"></div>
					<div class="jogada" data-indice="6"></div>
					<div class="jogada" data-indice="7"></div>
					<div class="jogada" data-indice="8"></div>
				</div>
			</div>

			<div style="display:inline-block;">
				<img src="img/jogador3.png" />
				<br />
				<span id="nome_jogador2"></span>
			</div>
			<div id="mensagem_box">
    			<h2 id="texto_mensagem"></h2>
    			<button id="btn_reiniciar">Jogar Novamente</button>
			</div>
		</div>

	</body>
</html>
